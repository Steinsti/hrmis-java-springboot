<!-- templates/departments/add-department-form.html -->
<div th:fragment="departmentFormModal" id="add-department-form">
    <form th:action="@{/departments/save}" th:object="${departmentRequestDTO}"
        method="post" class="space-y-6">
        <div>
            <label for="departmentName"
                class="block text-sm font-medium text-gray-700">Department
                Name</label>
            <input type="text" th:field="*{departmentName}" id="departmentName"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring focus:ring-teal-500 focus:ring-opacity-50"
                placeholder="Enter department name" required>
        </div>

        <div>
            <label for="departmentCode"
                class="block text-sm font-medium text-gray-700">Department
                Code</label>
            <input type="text" th:field="*{departmentCode}" id="departmentCode"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring focus:ring-teal-500 focus:ring-opacity-50"
                placeholder="Enter department code" required>
        </div>

        <div>
            <label for="description"
                class="block text-sm font-medium text-gray-700">Description</label>
            <textarea th:field="*{description}" id="description"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring focus:ring-teal-500 focus:ring-opacity-50"
                rows="3" placeholder="Enter description (optional)"></textarea>
        </div>

        <!-- <div class="flex items-center">
            <input type="checkbox" th:field="*{isActive}" id="isActive"
                class="h-4 w-4 text-teal-600 border-gray-300 rounded">
            <label for="isActive"
                class="ml-2 block text-sm text-gray-900">Active</label>
        </div> -->

        <!-- Hidden fields for ID and timestamps (if needed in update/edit context) -->
        <!-- <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{createdAt}" />
        <input type="hidden" th:field="*{updatedAt}" /> -->

        <div class="pt-4">
            <button type="submit"
                class="w-full inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-teal-600 hover:bg-teal-400">
                Add Department
            </button>
        </div>
    </form>
</div>

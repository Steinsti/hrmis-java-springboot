<!-- departments/departmentbase.html -->
<div th:fragment="department-base">
    <!-- Department base content goes here -->
    <div>
        <main class="flex-1 p-8">
            <div class="bg-white shadow-lg rounded-lg p-6">
                <h1
                    class="text-3xl font-semibold text-gray-800 mb-6">Departments
                    Overview</h1>

                <!-- Search and Filter Bar -->
                <div
                    class="flex flex-col sm:flex-row justify-between items-center mb-6 space-y-4 sm:space-y-0 sm:space-x-4">
                    <div class="relative w-full sm:w-1/2">
                        <input type="text" placeholder="Search departments..."
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <!-- Search icon placeholder -->
                        <span
                            class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">🔍</span>
                    </div>
                    <div class="relative w-full sm:w-1/3">
                        <select
                            class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-2 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-blue-500">
                            <option>Filter by Location</option>
                            <option>Main Office</option>
                            <option>Tech Hub</option>
                            <option>Downtown Office</option>
                            <option>Regional Branches</option>
                            <option>Remote/Call Center</option>
                        </select>
                        <div
                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                            <!-- Dropdown arrow placeholder -->
                            ▼
                        </div>
                    </div>
                </div>

                <div
                    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div th:if="${#lists.isEmpty(departments)}"
                        class="col-span-full text-center text-gray-500 py-12">
                        No departments available.
                    </div>
                    <div th:each="dept, iterStat : ${departments}"
                        th:unless="${#lists.isEmpty(departments)}"
                        class="p-6 rounded-lg shadow-md border flex flex-col justify-between border-gray-200">
                        <div>
                            <div class="flex items-center mb-3">
                                <h2 th:text="${dept.departmentName}"
                                    class="text-xl font-bold text-gray-800">
                                    Department Name
                                </h2>
                            </div>
                            <p class="text-gray-700 text-sm mb-4"
                                th:text="${dept.description}">Department
                                description</p>
                        </div>
                        <div>
                            <a
                                class="text-blue-600 hover:text-blue-800 font-semibold text-sm"
                                th:href="@{/departments/{id}(id=${dept.id})}">
                                View Details
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-span-full flex justify-start mt-4">
                    <button
                        class="bg-teal-600 cursor-pointer hover:bg-teal-400 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-150"
                        hx-get="/admin/dashboard/departments/new"
                        hx-target="#modal-container"
                        hx-swap="innerHTML"
                        hx-request='{"noCache":true}'>
                        <i class="fas fa-user-plus mr-2"></i>
                        Add New Department
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

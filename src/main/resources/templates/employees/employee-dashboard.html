<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Employee Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/styles.build.tailwind.css}">
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    </head>
    <body class="bg-gray-100 font-sans antialiased">
        <div class="min-h-screen flex">
            <!-- Sidebar -->
            <div id="sidebar"
                th:replace="~{fragments/sidebar :: sidebar(${userRole}, ${userName}, ~{::employeeNav})}"
                class="fixed inset-y-0 left-0 transform -translate-x-full md:translate-x-0 md:relative
                transition-transform duration-300 ease-in-out
                bg-slate-800 text-white w-64 space-y-6 py-7 px-2 z-30">
                <!-- nav will be injected here -->
            </div>

            <!-- Content -->
            <div id="content"
                class="flex-1 flex flex-col overflow-y-auto md:ml-64">
                <div id="header"
                    class="w-full"
                    th:replace="~{fragments/common-header :: header}">
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-6 px-4 py-2">
                    Welcome to Your profile!
                </h1>
            </div>

            <!-- Footer -->
            <div id="footer"
                class="w-full"
                th:replace="~{fragments/footer :: footer}"></div>
        </div>

        <!-- Employee nav fragment -->
        <th:block th:fragment="employeeNav">
            <div class="space-y-2">
                <a th:href="@{/#}"
                    class="flex items-center px-4 py-2.5 text-sm font-medium text-slate-300 rounded-lg hover:bg-slate-700 hover:text-slate-100 transition duration-150"><i
                        class="fas fa-home w-5 h-5 mr-3"></i> Dashboard</a>
                <a th:href="@{/profile}"
                    class="flex items-center px-4 py-2.5 text-sm font-medium text-slate-300 rounded-lg hover:bg-slate-700 hover:text-slate-100 transition duration-150"><i
                        class="fas fa-id-badge mr-3"></i> My Profile</a>
                <a th:href="@{/leave}"
                    class="flex items-center px-4 py-2.5 text-sm font-medium text-slate-300 rounded-lg hover:bg-slate-700 hover:text-slate-100 transition duration-150"><i
                        class="fas fa-calendar-alt mr-3"></i> My Leave</a>
                <a th:href="@{/payslips}"
                    class="flex items-center px-4 py-2.5 text-sm font-medium text-slate-300 rounded-lg hover:bg-slate-700 hover:text-slate-100 transition duration-150"><i
                        class="fas fa-money-check-alt mr-3"></i> Payslips</a>
            </div>
        </th:block>

        <script src="/js/sidebar.js"></script>
    </body>
</html>

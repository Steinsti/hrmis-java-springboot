 <div th:fragment="profile">
    <div
        class="max-w-max mx-auto mt-10 bg-white rounded-lg shadow-md p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Employee
            Profile</h1>
        <div th:if="${employee != null}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">First Name:</span>
                        <span
                            th:text="${employee.firstName}">John</span>
                    </p>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Last Name:</span>
                        <span
                            th:text="${employee.lastName}">Doe</span>
                    </p>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Email:</span>
                        <span
                            th:text="${employee.email}">john.doe@example.com</span>
                    </p>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Phone
                            Number:</span>
                        <span
                            th:text="${employee.phoneNumber}">123-456-7890</span>
                    </p>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Date of
                            Birth:</span>
                        <span
                            th:text="${employee.dateOfBirth}">1990-01-01</span>
                    </p>
                </div>
                <div>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Hire Date:</span>
                        <span
                            th:text="${employee.hireDate}">2020-01-01</span>
                    </p>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Designation:</span>
                        <span
                            th:text="${employee.designation}">Software
                            Engineer</span>
                    </p>
                    <p class="text-gray-600 mb-2"><span
                            class="font-semibold">Department:</span>
                        <span
                            th:text="${employee.department}">IT</span>
                    </p>
                </div>
            </div>
        </div>
        <div th:if="${employee == null}">
            <p class="text-gray-600">No profile information
                available.</p>
        </div>
    </div>
</div>
